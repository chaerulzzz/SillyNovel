<!--
    SillyNovel — Writing Workspace body.

    Phase 2, checkpoints 5-6: the five regions the shell provides — chapter
    navigation, editor, save status, suggestion pane, and a Context Inspector
    region. The editor saves as of checkpoint 6; the suggestion pane fills in 8
    and the Inspector in 9.

    Region visibility is driven from view.js rather than trusted to these
    attributes: this markup passes through DOMPurify on the way in.
-->
<div class="sillynovel-workspace">
    <p class="sillynovel-workspace-loading">Opening your workspace…</p>

    <div class="sillynovel-workspace-ready" hidden>
        <nav class="sillynovel-nav" aria-label="Chapters">
            <h4 class="sillynovel-project-title"></h4>
            <ul class="sillynovel-chapter-list"></ul>
            <button type="button" class="sillynovel-new-chapter">New chapter</button>
        </nav>

        <div class="sillynovel-editor-column">
            <h5 class="sillynovel-chapter-title"></h5>
            <!-- Writable as of checkpoint 6; autosave lives in view.js. -->
            <textarea class="sillynovel-editor" spellcheck="false"></textarea>
            <p class="sillynovel-save-status" role="status"></p>
        </div>

        <aside class="sillynovel-suggestions" aria-label="Suggestions">
            <h5>Suggestions</h5>
            <p class="sillynovel-suggestions-empty">Generated suggestions appear here. Nothing is ever inserted into the manuscript on its own.</p>
        </aside>

        <section class="sillynovel-inspector" aria-label="Context Inspector">
            <button type="button" class="sillynovel-inspector-toggle" aria-expanded="false">Context Inspector</button>
            <div class="sillynovel-inspector-body" hidden>
                <p class="sillynovel-inspector-note">Prompt blocks are labeled from the start. Contents arrive in checkpoint 9; block order is a tunable, not a decision.</p>
                <ul class="sillynovel-inspector-blocks"></ul>
            </div>
        </section>
    </div>

    <div class="sillynovel-workspace-error" hidden>
        <p class="sillynovel-error-message"></p>
        <button type="button" class="sillynovel-retry">Try again</button>
    </div>
</div>
